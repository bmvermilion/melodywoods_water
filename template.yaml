AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  melody-woods-water

  SAM Template for melody-woods-water

Parameters:
  KmsKeyArn:
    Type: String
    Description: KMS Key ARN for decrypting Sensaphone credentials
    Default: "arn:aws:kms:us-east-1:REDACTED:key/db7faab7-9c30-4f8e-8559-8b5824334944"
  DryRun:
    Type: String
    Description: Set to 'true' to skip actual Sensaphone output changes
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 128
    Timeout: 60
    Layers:
      - !Ref pysensaphoneLayer
    Environment:
      Variables:
        DRY_RUN: !Ref DryRun
        SENSAPHONE_CACHE_PARAMETER: /sensaphone/session
        SENSAPHONE_USERNAME: controls@melodywoodscontrols.awsapps.com

Resources:
  pysensaphoneLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: pysensaphone-lib
      Description: Shared Library for Sensaphone API v0.6.2
      ContentUri: ../layers/pysensaphone/python
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

  supply:
    Type: "AWS::Serverless::Function"
    Properties:
      CodeUri: supply/
      Handler: app.lambda_handler
      Description: 'Water Supply Control'
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: "*"
        - Statement:
            - Effect: Allow
              Action:
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sensaphone/session"
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Ref KmsKeyArn
      Events:
        Schedule1:
          Type: Schedule
          Properties:
            Description: "Well #3 Pump - Timer/Parameter Control"
            Name: "well3-timer"
            Input: '{"sentinel_name":"Well#3","pump_name": "#3 Well Pump", "pump": "", "reason": {"type": "well3"}}'
            Schedule: cron(0/15 * * * ? *)
        Schedule2:
          Type: Schedule
          Properties:
            Description: "Well #5 Pump - Timer/Parameter Control"
            Name: "well5-timer"
            Input: '{"sentinel_name":"Well#5","pump_name": "#5 Well Pump", "pump": "", "reason": {"type": "well5"}}'
            Schedule: cron(0/15 * * * ? *)
            Enabled: false
  tank88k:
    Type: "AWS::Serverless::Function"
    Properties:
      CodeUri: 88k_tank/
      Handler: app.lambda_handler
      Description: '88k Tank Control'
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: "*"
        - Statement:
            - Effect: Allow
              Action:
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sensaphone/session"
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Ref KmsKeyArn
      Events:
        Schedule1:
          Type: Schedule
          Properties:
            Description: "Turn On 88k 5hp Pump - 9PM"
            Name: "88kpump-on-9pm"
            Input: '{"pump": "on", "reason": "9PM"}'
            Schedule: cron(00 04,05 * * ? *)
        Schedule2:
          Type: Schedule
          Properties:
            Description: "88k Tank Hourly (5m past) Check"
            Name: "88kpump-hourly"
            Input: '{"pump": "", "reason": "Hourly"}'
            Schedule: cron(05 * * * ? *)
  email:
    Type: 'AWS::Serverless::Function'
    Properties:
      CodeUri: email/
      Handler: app.lambda_handler
      Description: 'Email Alert Handling'
      Environment:
        Variables:
          SUPPLY_LAMBDA_NAME: !Ref supply
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref supply
        - SSMParameterReadPolicy:
            ParameterName: "*"
        - S3ReadPolicy:
            BucketName: !Ref EmailStorageBucket
        - Statement:
            - Effect: Allow
              Action:
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sensaphone/session"
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Ref KmsKeyArn

  EmailStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "melody-woods-water-emails-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldEmails
            Status: Enabled
            ExpirationInDays: 7

  EmailStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EmailStorageBucket
      PolicyDocument:
        Statement:
          - Sid: AllowSESSaveEmail
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${EmailStorageBucket}/*"
            Condition:
              StringEquals:
                aws:Referer: !Ref AWS::AccountId

  AllowSESInvokeEmailLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref email
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # Legacy WorkMail trigger. Keep until the SES migration is fully cut over
  # and WorkMail is shut down (March 2027).
  PermissionToCallLambdaAbove:
      Type: AWS::Lambda::Permission
      DependsOn: email
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Ref email
        Principal: !Sub 'workmail.${AWS::Region}.amazonaws.com'

Outputs:
  emailArn:
    Value: !GetAtt email.Arn
